<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test maker</title>
<script>try{var p=localStorage.getItem('tm-theme')||'system';document.documentElement.dataset.theme=(p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<style>
:root{
  --bg:#f3f4fb;--card:#fff;--ink:#1f2340;--muted:#6b7090;--line:#e3e5f2;
  --pri:#5b5bf0;--pri2:#8b5cf6;--pri-soft:#eceeff;--danger:#ef4565;--ok:#12a150;
  --radius:14px;--shadow:0 6px 24px rgba(60,60,140,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(900px 400px at 100% -10%,#e0e3ff 0,transparent 60%),radial-gradient(700px 360px at -10% 0,#f0e3ff 0,transparent 60%);
  background-attachment:fixed}

/* ===== верхняя панель ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:18px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 4px 12px rgba(91,91,240,.4)}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ===== кнопки ===== */
button{cursor:pointer;border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;font-family:inherit;white-space:nowrap;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transition:.15s;box-shadow:0 2px 8px rgba(91,91,240,.25)}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:none}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.sec:hover{background:var(--pri-soft);border-color:#c9ccff}
button.del{background:#fff;color:var(--danger);border:1px solid #ffd3dc;box-shadow:none}
button.del:hover{background:#fff0f3}
button.new{background:linear-gradient(135deg,#12a150,#22c55e);box-shadow:0 2px 10px rgba(18,161,80,.3)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none}

.lang{display:inline-flex;background:var(--pri-soft);border-radius:10px;padding:3px;gap:2px}
.lang button{background:transparent;color:var(--muted);box-shadow:none;padding:8px 14px;border-radius:8px}
.lang button.active{background:#fff;color:var(--pri);box-shadow:0 1px 4px #0002}
.keybox{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;background:#fff;border:1px solid var(--line);margin:0;color:var(--ink);
  padding:10px 16px;border-radius:10px;cursor:pointer}
.keybox input{width:auto;accent-color:var(--pri)}

/* ===== сетка ===== */
.app{display:grid;grid-template-columns:minmax(360px,500px) 1fr;gap:20px;padding:20px;align-items:start;max-width:1500px;margin:0 auto}
.panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ed-head h2{margin:0;font-size:19px}
.sec-title{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:14px;font-weight:700;color:var(--pri)}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;
  background:#fbfbff;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px #5b5bf01f}
textarea{resize:vertical;min-height:56px}
.row{display:flex;gap:10px}.row>*{flex:1}

/* кнопки типов заданий */
.adds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.adds .add{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;color:var(--ink);border:1.5px dashed #c9ccff;box-shadow:none;padding:10px}
.adds .add:hover:not(:disabled){background:var(--pri-soft);border-style:solid}
.adds .add .ic{font-size:18px}
.adds .add.text{border-color:#f5c26b;background:#fffaf0}
.hint{font-size:12px;color:var(--muted);margin:6px 0}
.score{display:inline-flex;align-items:center;gap:6px;background:var(--pri-soft);color:var(--pri);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;margin-top:10px}

/* карточки заданий */
.card{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:#fcfcff;position:relative;border-left:5px solid var(--pri)}
.card.t-text{border-left-color:#f59e0b;background:#fffdf7}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.card-h b{font-size:14px}
.card-h div{display:flex;gap:4px}
.card-h button{padding:4px 9px}
.opt{display:flex;gap:6px;align-items:center;margin:5px 0}
.opt input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--pri)}
.opt button{padding:6px 10px}
.empty-ed{text-align:center;color:var(--muted);padding:22px 10px;border:2px dashed var(--line);border-radius:12px;margin-top:10px;font-size:13px}

/* ===== лист ===== */
.sheet-wrap{display:flex;justify-content:center}
.paper{width:100%;max-width:820px;background:#fff;padding:36px 44px;min-height:700px;font-family:"Times New Roman",serif;font-size:15px;
  line-height:1.5;box-shadow:var(--shadow);border-radius:6px;border:1px solid var(--line)}
.paper h1{font-size:17px;text-align:center;margin:0 0 14px}
.paper .meta p{margin:3px 0}
.u{display:inline-block;min-width:120px;border-bottom:1px solid #000;padding:0 6px}
.task{margin:18px 0;page-break-inside:avoid}
.task .tt{font-weight:bold}
.task .pts{float:right;font-weight:normal;font-style:italic}
.lines div{border-bottom:1px solid #777;height:26px}
.opts{margin:4px 0 0 18px}
.mt{width:100%;border-collapse:collapse;margin-top:6px}
.mt td{padding:4px 8px;vertical-align:top}
.mt td.mid{width:90px;text-align:center}
.paper img{max-width:100%;max-height:300px;display:block;margin:8px 0}
.ans{color:#0a7a2f;font-weight:bold}
.textblock{margin:16px 0;padding:10px 14px;border:1px solid #999;border-left:4px solid #444;background:#fafafa;page-break-inside:avoid}
.textblock .tb-t{font-weight:bold;margin-bottom:4px}
.paper .empty{color:#999;text-align:center;margin-top:60px;font-family:"Segoe UI",Arial,sans-serif}

/* ===== формулы ===== */
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
.math .mo{margin:0 .18em}
.math .mnm{margin-right:.12em}
.math .mbig{font-size:1.35em;line-height:1;vertical-align:-.12em}
.math sup,.math sub{font-size:.72em;line-height:0}
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.25}
.mf>span{padding:0 .22em}
.mf>.mfn{border-bottom:1px solid currentColor}
.mrt{display:inline-block;white-space:nowrap}
.mrt .mrb{border-top:1px solid currentColor;padding:0 .12em;margin-left:-.06em}
.mrt .mri{margin-right:-.3em}
.mss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.7em;line-height:1.15;margin-left:.08em}
.mst{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em}
.mst>.mstt,.mst>.mstb{font-size:.7em}
.mbox{display:inline-block;width:.6em;height:.7em;border:1px solid currentColor;vertical-align:-.1em;opacity:.7;margin:0 .05em}

/* ===== клетки ===== */
.gridwrap{max-width:100%;overflow-x:auto}
.gridt{border-collapse:collapse;margin:8px 0}
.gridt td{border:1px solid #444;padding:0;text-align:center;vertical-align:middle;line-height:1;overflow:hidden}
.gridblock{margin:14px 0}
.card.t-grid{border-left-color:#10b981;background:#f6fffb}
.adds .add.grid{border-color:#7fd1ae;background:#f2fdf8}
.gridbox{border:1.5px dashed #b7e4d0;border-radius:10px;padding:8px 10px;margin-top:10px;background:#f6fffb}
.gridbox summary{cursor:pointer;font-weight:700;font-size:13px;color:#0d9467}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;font-size:12px;color:var(--muted)}
.chip{padding:5px 11px;font-size:13px}

/* ===== клавиатура формул ===== */
.kp{position:fixed;right:20px;bottom:20px;width:440px;max-width:calc(100vw - 16px);z-index:45;background:#202124;color:#e8eaed;border-radius:22px;padding:12px 14px 14px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);--fn:#303236;--snd:#cdbcff;user-select:none;font-family:"Segoe UI",Roboto,Arial,sans-serif}
.kp[data-tab=trig]{--fn:#2c3328;--snd:#78a38e}
.kp[data-tab=calc]{--fn:#3d2b2c;--snd:#ffb4bc}
.kp[data-tab=chem]{--fn:#243545;--snd:#8ab4f8}
.kp-h{display:flex;justify-content:space-between;align-items:center;cursor:move;font-size:18px;margin:0 2px 8px;touch-action:none}
.kp button{background:#2d2e31;color:#e8eaed;border:0;border-radius:999px;padding:0;height:44px;min-width:0;font:600 15px "Cambria Math","Times New Roman",serif;
  box-shadow:none;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.kp button:hover{transform:none;filter:brightness(1.3)}
.kp button:active{filter:brightness(1.6)}
.kp .k-n{background:#2a2b2e;font:500 17px "Segoe UI",Roboto,Arial,sans-serif}
.kp .k-o{background:#38393d;font:500 17px "Segoe UI",Roboto,Arial,sans-serif}
.kp .k-fn{background:var(--fn)}
.kp .k-send{background:var(--snd);color:#1d1b20;font-size:18px}
.kp .kp-x{height:32px;width:32px;background:transparent;font-size:16px}
.kp-pv{min-height:46px;border:1px solid #5f6368;border-radius:24px;padding:8px 16px;margin-bottom:8px;font-size:19px;display:flex;align-items:center;overflow-x:auto;white-space:nowrap}
.kp-ph{color:#80868b;font:14px "Segoe UI",sans-serif}
.kp-tabs{display:flex;gap:4px;border-bottom:1px solid #3c4043;margin-bottom:10px}
.kp .kp-tabs button{background:transparent;height:34px;padding:0 10px;border-radius:0;color:#9aa0a6;font:500 14px "Segoe UI",Roboto,sans-serif;border-bottom:2px solid transparent}
.kp .kp-tabs button.on{color:#e8eaed;border-bottom-color:#aecbfa}
.kp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kp-fab{position:fixed;right:18px;bottom:18px;z-index:44;padding:12px 18px;border-radius:999px;font-size:15px}
@media (max-width:640px){
  .kp{left:8px;right:8px;bottom:8px;width:auto;border-radius:18px;padding:10px}
  .kp button{height:40px;font-size:13px}.kp-grid{gap:4px}
}
@media print{.kp,.kp-fab{display:none!important}}

[hidden]{display:none!important}
.brand{cursor:pointer}
.home-wrap{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.hero{text-align:center;padding:56px 0 30px}
.badge{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:16px auto 12px;max-width:760px;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:640px;margin:0 auto;font-size:17px;color:var(--muted);line-height:1.6}
.cta{margin:30px auto 0;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.cta-l{font-weight:700;margin-bottom:10px}
.seg{display:flex;background:var(--pri-soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;background:transparent;color:var(--muted);box-shadow:none;padding:10px 8px}
.seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 2px 8px rgba(91,91,240,.25)}
.cta .big{width:100%;padding:14px;font-size:16px}
.cta .sec{width:100%;margin-top:10px}
.block{padding:28px 0}
.block h2{text-align:center;margin:0 0 18px;font-size:24px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.feat .fi{font-size:28px}.feat h3{margin:8px 0 4px;font-size:16px}.feat p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font-weight:600}
.step .num{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 0}

/* ===== тёмная тема ===== */
html[data-theme=dark]{color-scheme:dark;--bg:#0f1020;--card:#1a1c30;--ink:#e8eaf6;--muted:#9aa0c4;--line:#2d3052;--pri-soft:#262a50;--shadow:0 6px 24px rgba(0,0,0,.45)}
html[data-theme=dark] body{background-image:radial-gradient(900px 400px at 100% -10%,#1d2050 0,transparent 60%),radial-gradient(700px 360px at -10% 0,#2a1a4d 0,transparent 60%)}
html[data-theme=dark] .topbar{background:rgba(22,24,44,.88)}
html[data-theme=dark] button.sec,html[data-theme=dark] .keybox{background:#23264a}
html[data-theme=dark] button.sec:hover{border-color:#4a4f90}
html[data-theme=dark] button.del{background:#2b1f33;border-color:#5a2a38}
html[data-theme=dark] button.del:hover{background:#3a2230}
html[data-theme=dark] .lang button.active{background:#363a78;color:#d6d8ff}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#14162a}
html[data-theme=dark] input:focus,html[data-theme=dark] select:focus,html[data-theme=dark] textarea:focus{background:#1a1c30}
html[data-theme=dark] .adds .add{background:#1f2240;border-color:#4a4f90}
html[data-theme=dark] .adds .add.text{background:#3a3020;border-color:#8a6a2a}
html[data-theme=dark] .adds .add.grid{background:#14302a;border-color:#2a7a5a}
html[data-theme=dark] .card{background:#1e2040}
html[data-theme=dark] .card.t-text{background:#2b2618}
html[data-theme=dark] .card.t-grid,html[data-theme=dark] .gridbox{background:#15302a;border-color:#2a6a4f}
html[data-theme=dark] .gridbox summary{color:#34d399}
html[data-theme=dark] .toast{background:#e8eaf6;color:#111}
.paper{color:#000;background:#fff;color-scheme:light}
.themes{margin-right:2px}
/* ===== плоскость ===== */
.planewrap{margin:8px 0;page-break-inside:avoid}.planewrap svg{max-width:100%;height:auto;display:block}
/* ===== калькулятор ===== */
.calc-fab{position:fixed;left:18px;bottom:18px;z-index:44;padding:12px 18px;border-radius:999px;font-size:15px}
.calc{position:fixed;left:18px;bottom:18px;width:350px;max-width:calc(100vw - 16px);z-index:46;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.3);outline:0;user-select:none}
.calc-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px;cursor:grab;touch-action:none}
.calc-h div{display:flex;gap:6px}.calc-h button{padding:4px 10px;font-size:12px;border-radius:8px}
.calc-top{display:flex;gap:6px;align-items:stretch}
.calc-disp{flex:1;min-width:0;min-height:68px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font:22px/1.3 "Cambria Math",Cambria,"Times New Roman",serif;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;cursor:text}
.cp-col{display:flex;flex-direction:column;gap:6px}.cp-col button{flex:1;padding:6px 9px;font-size:13px;border-radius:8px}
.calc-res{min-height:24px;text-align:right;color:var(--muted);font-size:15px;padding:5px 4px 8px}
.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ck{padding:11px 0;font-size:16px;border-radius:10px;box-shadow:none;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ck.n{background:var(--pri-soft)}.ck.op{color:var(--pri);font-weight:800}
.ck.eq{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.cro{display:inline-flex;align-items:center;white-space:nowrap;min-width:24px;min-height:1.3em}
.cc{padding:0 1px}
.cf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.cf .cr,.cs .cr{display:inline-flex;align-items:center;justify-content:center;min-width:.9em;padding:0 3px;border-radius:4px;cursor:text}
.cfbar{align-self:stretch;border-top:2px solid currentColor;margin:1px 0}
.cs{display:inline-flex;align-items:stretch}.csr{align-self:center}
.csb{border-top:2px solid currentColor}
sup.cp{display:inline-flex;align-items:center;font-size:.62em;min-width:.7em;padding:0 2px;margin-left:1px;border-radius:4px;position:relative;top:-.55em}
.cr:hover:not(.cro){background:rgba(91,91,240,.14)}
.cr.cact:not(.cro){background:rgba(91,91,240,.22);outline:1.5px solid var(--pri)}
.cph{display:inline-block;width:.65em;height:.85em;border:1.5px dashed var(--muted);border-radius:3px;opacity:.7}
.ccur{display:inline-block;width:2px;height:1.1em;background:var(--pri);margin:0 1px;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:640px){.calc{left:8px;right:8px;bottom:8px;width:auto}.calc-fab{left:10px;bottom:10px}}
@media print{.calc,.calc-fab{display:none!important}body{background:#fff!important;background-image:none!important}}

/* тост */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){.app{grid-template-columns:1fr;padding:12px}.paper{padding:22px 18px}}
@media print{
  body{background:#fff}.app{display:block;padding:0;max-width:none}
  .panel.ed,.topbar,.toast{display:none}.paper{box-shadow:none;border:0;padding:0;max-width:none}
}
/* ===== защита от выхода текста за края ===== */
.app{grid-template-columns:minmax(360px,500px) minmax(0,1fr)}
.panel,.sheet-wrap,.card,.home-wrap,.hero,.cta,.feat,.step{min-width:0;overflow-wrap:anywhere}
input,select,textarea{max-width:100%;min-width:0}
.row{flex-wrap:wrap}.row>*{flex:1 1 84px;min-width:0}
.ed-head{flex-wrap:wrap}
.adds .add{white-space:normal;line-height:1.25;min-width:0}
.adds .add span:last-child{min-width:0;overflow-wrap:anywhere}
.seg button{white-space:normal;line-height:1.2;min-width:0}
.card-h b{min-width:0;overflow-wrap:anywhere}
.opt input:not([type=checkbox]){min-width:0}
.card-h{flex-wrap:wrap}
.paper{overflow-wrap:break-word;word-wrap:break-word}
.paper .u{max-width:100%}.paper table{max-width:100%}.paper .mt td{overflow-wrap:anywhere}
.paper img,.paper svg{max-width:100%}
/* ===== дескрипторы и спецификация ===== */
.autob{background:var(--pri-soft);color:var(--pri);padding:1px 8px;border-radius:999px;font-size:11px;margin-left:6px;font-weight:700}
.gridbox.descbox{background:var(--pri-soft);border-color:#c9ccff}
.gridbox.descbox summary{color:var(--pri)}
html[data-theme=dark] .gridbox.descbox{background:#1e2150;border-color:#4a4f90}
html[data-theme=dark] .gridbox.descbox summary{color:#aeb3ff}
.dt{border-collapse:collapse;margin:6px 0;width:100%}
.dt th,.dt td{border:1px solid #444;padding:3px 8px;text-align:left;vertical-align:top}
.dt th{background:#eee}.dt td:last-child{white-space:nowrap}
.dsm{font-size:.85em;color:#444}
@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main id="home">

// ===== Формулы: мини-рендерер ($...$) =====
let MATH_LINEAR = false;   // true — «линейный» вид для Word (дроби a/b, корни √)
const M_NAMES = ['sin','cos','tan','cot','sec','csc','arcsin','arccos','arctan','sinh','cosh','tanh','log','ln','lg','lim','exp','max','min','det','mod'];
const M_BIG = { sum:'∑', prod:'∏', int:'∫', oint:'∮' };
const M_OPS = '+−=×÷<>≤≥≠±∓→⇒↔≈·⇌∈∪∩';
const M_SYM = { infty:'∞', leq:'≤', le:'≤', geq:'≥', ge:'≥', neq:'≠', ne:'≠', pm:'±', mp:'∓', cdot:'·', times:'×', div:'÷',
  to:'→', rightarrow:'→', Rightarrow:'⇒', leftrightarrow:'↔', circ:'°', degree:'°', approx:'≈', partial:'∂', rightleftharpoons:'⇌',
  uparrow:'↑', downarrow:'↓', in:'∈', cup:'∪', cap:'∩', angle:'∠', perp:'⊥', parallel:'∥', ldots:'…', ',':'\u2009', ' ':'\u00a0', ';':'\u2005' };
'alpha:α beta:β gamma:γ delta:δ epsilon:ε varepsilon:ε zeta:ζ eta:η theta:θ iota:ι kappa:κ lambda:λ mu:μ nu:ν xi:ξ pi:π rho:ρ sigma:σ tau:τ phi:φ varphi:φ chi:χ psi:ψ omega:ω Gamma:Γ Delta:Δ Theta:Θ Lambda:Λ Xi:Ξ Pi:Π Sigma:Σ Phi:Φ Psi:Ψ Omega:Ω'
  .split(' ').forEach(p => { const [k, v] = p.split(':'); M_SYM[k] = v; });

function mathToHtml(src) {
  try { return '<span class="math">' + mathParse(String(src)) + '</span>'; }
  catch (e) { return esc(src); }
}

function mathParse(src) {
  let i = 0; const n = src.length;
  const plain = h => h.replace(/<[^>]+>/g, '');
  const par = h => /^[\w.,]*$/.test(plain(h)) ? h : '(' + h + ')';
  const skip = () => { while (i < n && /\s/.test(src[i])) i++; };
  const sym = c => M_OPS.includes(c) ? '<span class="mo">' + esc(c) + '</span>' : esc(c);
  const chr = c => {
    if (c === '□') return MATH_LINEAR ? '□' : '<span class="mbox"></span>';
    if (/[A-Za-z]/.test(c)) return '<i>' + c + '</i>';
    if (c === '-') c = '−';
    return sym(c);
  };
  function seq(inG) {
    let out = '';
    for (;;) {
      skip();
      if (i >= n) break;
      if (src[i] === '}') { if (inG) break; i++; continue; }
      out += term();
    }
    return out;
  }
  function brace() { i++; const r = seq(true); if (src[i] === '}') i++; return r; }
  function group() {
    skip();
    if (i >= n || src[i] === '}') return '';
    if (src[i] === '{') return brace();
    return atom().h;
  }
  function arg() {
    skip();
    if (i >= n || src[i] === '}' || src[i] === '^' || src[i] === '_') return '';
    if (src[i] === '{') return brace();
    if (/\d/.test(src[i])) { const m = /^\d+/.exec(src.slice(i))[0]; i += m.length; return m; }
    return atom().h;
  }
  function term() {
    const b = atom();
    let sup = '', sub = '';
    for (;;) {
      skip();
      if (src[i] === '^') { i++; sup = arg(); }
      else if (src[i] === '_') { i++; sub = arg(); }
      else break;
    }
    return attach(b, sub, sup);
  }
  function attach(b, sub, sup) {
    if (!sub && !sup) return b.h;
    if (MATH_LINEAR) return b.h + (sub ? '<sub>' + sub + '</sub>' : '') + (sup ? '<sup>' + sup + '</sup>' : '');
    if (b.kind === 'stack') return '<span class="mst">' + (sup ? '<span class="mstt">' + sup + '</span>' : '') + '<span>' + b.h + '</span>' + (sub ? '<span class="mstb">' + sub + '</span>' : '') + '</span>';
    if (sub && sup) return b.h + '<span class="mss"><span>' + sup + '</span><span>' + sub + '</span></span>';
    return b.h + (sub ? '<sub>' + sub + '</sub>' : '<sup>' + sup + '</sup>');
  }
  function frac(a, b) {
    if (MATH_LINEAR) return par(a) + '/' + par(b);
    return '<span class="mf"><span class="mfn">' + a + '</span><span>' + b + '</span></span>';
  }
  function root(idx, x) {
    if (MATH_LINEAR) return (idx ? '<sup>' + idx + '</sup>' : '') + '√' + par(x);
    return '<span class="mrt">' + (idx ? '<sup class="mri">' + idx + '</sup>' : '') + '<span>√</span><span class="mrb">' + x + '</span></span>';
  }
  function cmd(name) {
    if (name === 'frac' || name === 'dfrac' || name === 'tfrac') { const a = group(), b = group(); return { h: frac(a, b) }; }
    if (name === 'sqrt') {
      skip(); let idx = '';
      if (src[i] === '[') { const j = src.indexOf(']', i); if (j > 0) { idx = mathParse(src.slice(i + 1, j)); i = j + 1; } }
      return { h: root(idx, group()) };
    }
    if (name === 'text' || name === 'mathrm') {
      skip();
      if (src[i] === '{') { const j = src.indexOf('}', i); const raw = src.slice(i + 1, j < 0 ? n : j); i = j < 0 ? n : j + 1; return { h: esc(raw) }; }
      return { h: '' };
    }
    if (name === 'left' || name === 'right' || name === 'big' || name === 'Big') return { h: '' };
    if (M_BIG[name]) return { h: '<span class="mbig">' + M_BIG[name] + '</span>', kind: name === 'int' || name === 'oint' ? 'side' : 'stack' };
    if (M_NAMES.includes(name)) return { h: '<span class="mnm">' + name + '</span>', kind: name === 'lim' ? 'stack' : '' };
    if (M_SYM[name] !== undefined) return { h: sym(M_SYM[name]) };
    return { h: esc(name) };
  }
  function atom() {
    skip();
    if (i >= n) return { h: '' };
    const c = src[i];
    if (c === '^' || c === '_' || c === '}') return { h: '' };
    if (c === '{') return { h: brace() };
    if (c === '\\') {
      i++;
      if (i >= n) return { h: '' };
      if (!/[A-Za-z]/.test(src[i])) { const ch = src[i++]; return { h: sym(M_SYM[ch] ?? ch) }; }
      let name = ''; while (i < n && /[A-Za-z]/.test(src[i])) name += src[i++];
      return cmd(name);
    }
    i++;
    return { h: chr(c) };
  }
  return seq(false);
}

// текст с формулами: $...$ → формула, остальное экранируется
function rich(s, post) {
  const parts = [];
  let txt = String(s ?? '').replace(/\$([^$]+)\$/g, (m, f) => { parts.push(mathToHtml(f)); return '\u0001' + (parts.length - 1) + '\u0002'; });
  txt = esc(txt);
  if (post) txt = post(txt);
  return txt.replace(/\u0001(\d+)\u0002/g, (m, i) => parts[+i]);
}
const nl = s => rich(s).replace(/\n/g, '<br>');

// ===== Клетки (сетки) =====
function defGrid(r = 0, c = 0) { return { rows: r, cols: c, size: 7, fill: '', key: '' }; }

function gridTokens(line) {
  const out = []; let i = 0;
  while (i < line.length) {
    if (line[i] === '$') { const j = line.indexOf('$', i + 1); if (j > i + 1) { out.push({ m: line.slice(i + 1, j) }); i = j + 1; continue; } }
    const ch = String.fromCodePoint(line.codePointAt(i));
    out.push({ t: ch }); i += ch.length;
  }
  return out;
}

function gridHtml(g, key) {
  if (!g) return '';
  const rows = Math.min(40, Math.max(0, parseInt(g.rows) || 0)), cols = Math.min(40, Math.max(0, parseInt(g.cols) || 0));
  if (!rows || !cols) return '';
  let size = +g.size || 7;
  size = Math.max(3, Math.min(size, Math.floor(1750 / cols) / 10));   // чтобы влезло в ширину листа
  const src = (key && g.key) ? g.key : (g.fill || '');
  const data = [];
  String(src).split('\n').forEach(line => {
    const arr = gridTokens(line);
    if (!arr.length) { data.push([]); return; }
    for (let k = 0; k < arr.length; k += cols) data.push(arr.slice(k, k + cols));
  });
  const fs = Math.max(8, Math.round(size * 1.7));
  let h = `<div class="gridwrap"><table class="gridt" style="font-size:${fs}pt">`;
  for (let r = 0; r < rows; r++) {
    h += '<tr>';
    for (let c = 0; c < cols; c++) {
      const cell = data[r] && data[r][c];
      const inner = !cell ? '' : cell.m !== undefined ? mathToHtml(cell.m) : (cell.t.trim() ? esc(cell.t) : '');
      h += `<td style="width:${size}mm;height:${size}mm">${inner}</td>`;
    }
    h += '</tr>';
  }
  return h + '</table></div>';
}

function gridEditor(t, standalone) {
  const u = U(), g = t.grid || (t.grid = defGrid());
  const active = +g.rows > 0 && +g.cols > 0;

    </div>
    <div class="chips">${u.presets}

      ${standalone ? '' : `<button class="del chip" data-act="grid-off" data-id="${t.id}">${u.clearGrid}</button>`}</div>
    <label>${u.fill}</label><textarea data-id="${t.id}" data-f="grid" data-g="fill">${esc(g.fill)}</textarea>
    <label>${u.fillKey}</label><textarea data-id="${t.id}" data-f="grid" data-g="key">${esc(g.key)}</textarea>

  if (type === 'test')  t.opts = [{t:'',c:false},{t:'',c:false},{t:'',c:false},{t:'',c:false}];
  if (type === 'match') t.pairs = [{l:'',r:''},{l:'',r:''},{l:'',r:''}];
  if (type === 'gaps')  t.text = '';
  if (type === 'open')  { t.lines = 5; t.ans = ''; }
  if (type === 'image') { t.src = ''; t.lines = 3; t.ans = ''; }
  if (type === 'audio') { t.mode = 'listen'; t.text = ''; t.lines = 4; t.ans = ''; }
  if (type === 'text')  { t.title = ''; t.text = ''; t.pts = 0; }
  if (type === 'plane') { t.plane = defPlane(); t.pp = [{n:'A',x:'',y:''}]; t.fn = []; }
  if (type === 'grid')  { t.pts = 0; t.grid = defGrid(3, 8); }
  else if (type !== 'text') t.grid = defGrid(0, 0);
  return t;
}

function seededShuffle(arr, seed) {
  const a = arr.map((v, i) => ({v, i})); let s = seed;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderPaper() {
  const s = state, key = s.key, T = LANGS();
  document.documentElement.lang = s.lang || 'ru';
  const d = s.date ? s.date.split('-') : null;
  const dateStr = d ? T.date(d[2], T.months[+d[1]-1], d[0]) : T.dateBlank;
  const subjName = T.subj[s.subject] || s.subject;
  const u = (v, n=20) => v ? `<span class="u">${rich(v)}</span>` : blank(n);
  const gridOK = !!(SUBJECTS[s.subject] && SUBJECTS[s.subject].grid);

  let h = `<div class="meta">`;
  h += s.type === 'СОР'
    ? `<h1>${T.sor(u(s.num,3), u(s.topic,40))}</h1>`
    : `<h1>${T.soch}</h1>`;
  h += `<p>${T.subject}: ${u(subjName,24)}</p>
    <p>${T.quarter}: ${u(s.quarter,5)}</p><p>${T.cls}: ${u(s.cls,8)}</p>
    <p>${T.fio}: ${u(s.fio,50)}</p>
    <p>${T.dateL}: ${dateStr}</p>
    <p>${T.max}: <b>${total()}</b></p>
    <p>${T.got}: ______</p></div><hr>`;

  let n = 0;
  s.tasks.forEach(t => {
    if (t.type === 'text') {
      if (t.title || t.text) {
        h += `<div class="textblock">${t.title ? `<div class="tb-t">${rich(t.title)}</div>` : ''}<div>${nl(t.text)}</div></div>`;
      }
      return;
    }
    if (t.type === 'grid') {
      const gh = gridOK ? gridHtml(t.grid, key) : '';
      if (t.q || gh) h += `<div class="task gridblock">${t.q ? `<div>${nl(t.q)}</div>` : ''}${gh}</div>`;
      return;
    }
    n++;
    h += `<div class="task"><div class="tt">${T.task} ${n}. <span class="pts">[${effPts(t)} ${T.pt}]</span></div>`;
    if (t.q) h += `<div>${nl(t.q)}</div>`;

    if (t.type === 'plane') {
      h += planeBlock(t, key);
    } else if (t.type === 'test') {
      h += `<div class="opts">` + t.opts.filter(o => o.t).map((o, i) =>
        `<div class="${key && o.c ? 'ans' : ''}">${T.opt[i]}) ${rich(o.t)}${key && o.c ? ' ✔' : ''}</div>`).join('') + `</div>`;
    } else if (t.type === 'match') {
      const ps = t.pairs.filter(p => p.l || p.r);
      const sh = seededShuffle(ps, t.id % 1000 + 7);
      h += `<table class="mt">` + ps.map((p, i) => `<tr><td>${i+1}. ${rich(p.l)}</td><td class="mid">${key ? '' : '——'}</td>
        <td>${T.let[i]}. ${rich(sh[i].v.r)}</td></tr>`).join('') + `</table>`;
      if (key) {
        h += `<div class="ans">${T.keyL}: ` + ps.map((p, i) => `${i+1}–${T.let[sh.findIndex(x => x.i === i)]}`).join(', ') + `</div>`;
      }
    } else if (t.type === 'gaps') {
      h += `<div>` + rich(t.text, txt => txt.replace(/\*([^*]+)\*/g, (m, w) => key ? `<span class="ans">${w}</span>` : `<span class="u" style="min-width:${Math.max(60, w.replace(/\u0001\d+\u0002/g,'MMM').length*9)}px"></span>`)).replace(/\n/g,'<br>') + `</div>`;
    } else {
      if (t.type === 'audio') {
        h += `<div><i>${isListen(t.mode) ? T.listen : T.speak}</i></div>`;
        if (key && t.text) h += `<div class="ans">${T.teacherText}: ${nl(t.text)}</div>`;
      }
      if (t.type === 'image' && t.src) h += `<img src="${t.src}" alt="">`;
      if (key && t.ans) h += `<div class="ans">${T.ansL}: ${nl(t.ans)}</div>`;
      else if (+t.lines > 0) h += `<div class="lines">${'<div></div>'.repeat(+t.lines)}</div>`;
    }
    if (gridOK && t.grid) h += gridHtml(t.grid, key);
    if (key) { const ds = (t.desc || []).filter(d => d.t); if (ds.length) h += descTable(ds, T); }
    h += `</div>`;
  });
  if (key) h += blueprint(s, T, U());
  if (!s.tasks.length) h += `<p class="empty">${T.empty}</p>`;
  $('#paper').innerHTML = h;
  const sum = $('#sum'); if (sum) sum.textContent = total();
}

function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type: mime}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function svgToImg(svg) {
  return new Promise(res => {
    const w = +(/width="(\d+)"/.exec(svg) || [])[1] || 400, h = +(/height="(\d+)"/.exec(svg) || [])[1] || 400;
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      res(`<img src="${c.toDataURL('image/png')}" width="${w}" height="${h}">`); };
    img.onerror = () => res('');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function kpRender() {
  const kp = U().kp, fn = kpTabs()[kpTab];
  const back = { lab: '⌫', a: 'back', c: 'k-o' }, ac = { lab: 'AC', a: 'ac', c: 'k-o' }, next = { lab: '➤', a: 'next', c: 'k-send' };
  const nums = [[kpS('('), kpS(')'), back, ac], ['7', '8', '9', '÷'], ['4', '5', '6', '×'], ['1', '2', '3', '−'], ['0', ',', next, '+']];
  const keys = [];
  for (let r = 0; r < 5; r++) {
    keys.push(...fn.slice(r * 3, r * 3 + 3));
    nums[r].forEach(k => keys.push(typeof k === 'string' ? kpN(k) : k.c === 'k-fn' ? Object.assign({}, k, { c: 'k-o' }) : k));
  }
  KP_KEYS = keys;
  KP_EL.dataset.tab = kpTab;
  KP_EL.innerHTML = `<div class="kp-h"><span>${kp.title}</span><button class="kp-x" data-kp="close">✕</button></div>

    group = [];
  };
  el.childNodes.forEach(n => {
    if (n.nodeType === 1 && DX_BLOCK.has(n.tagName)) { flush(); out += dxEl(n, st, ctx, po); } else group.push(n);

}
function dxEl(el, st, ctx, po) {
  const cl = el.classList, tag = el.tagName;
  if (tag === 'TABLE') return dxTable(el, ctx);
  if (tag === 'HR') return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="000000"/></w:pBdr></w:pPr></w:p>';
  if (tag === 'H1') return `<w:p>${dxPPr({ jc: 'center', before: 0, after: 200 })}${dxInline(el, { ...st, b: 1, sz: 28 }, ctx)}</w:p>`;
  if (cl.contains('lines')) return [...el.children].map(() => '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="777777"/></w:pBdr><w:spacing w:before="240" w:after="0"/></w:pPr></w:p>').join('');
  if (cl.contains('tt')) return `<w:p>${dxPPr({ keep: 1, before: 200, after: 60 })}${dxInline(el, { ...st, b: 1 }, ctx)}</w:p>`;
  if (cl.contains('textblock')) return dxBlocks(el, st, ctx, { ...po, bdr: 'box', shd: 'F5F5F5' });
  if (cl.contains('opts')) return dxBlocks(el, st, ctx, { ...po, ind: 360 });
  const st2 = cl.contains('ans') ? { ...st, b: 1, color: '0A7A2F' } : st;
  return dxBlocks(el, st2, ctx, po);
}
function dxTable(tb, ctx) {
  const rows = [...tb.rows]; if (!rows.length) return '';
  const nc = Math.max(...rows.map(r => r.cells.length)), total = 9800;
  const isGrid = tb.classList.contains('gridt'), noB = tb.classList.contains('mt');
  const mm = c => { const m = /width:([\d.]+)mm/.exec(c.getAttribute('style') || ''); return m ? Math.round(+m[1] * 56.7) : 0; };
  let widths = [];
  for (let k = 0; k < nc; k++) widths.push(isGrid && rows[0].cells[k] && mm(rows[0].cells[k]) ? mm(rows[0].cells[k]) : Math.round(total / nc));
  if (noB && nc === 3) widths = [4400, 1000, 4400];
  if (!isGrid && nc === 3 && !noB) widths = [1300, total - 1300 - 1400, 1400];
  if (!isGrid && nc === 2 && !noB) widths = [total - 1500, 1500];
  const b = noB ? 'nil' : 'single';
  const bd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="${b}" w:sz="4" w:space="0" w:color="444444"/>`).join('');
  let x = `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a, c) => a + c, 0)}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
  rows.forEach(r => {
    x += '<w:tr>' + (isGrid ? `<w:trPr><w:trHeight w:val="${widths[0]}" w:hRule="atLeast"/></w:trPr>` : '');
    [...r.cells].forEach((c, k) => {
      const th = c.tagName === 'TH';
      const inner = dxBlocks(c, th ? { b: 1 } : {}, ctx, { before: 0, after: 20, jc: isGrid || c.classList.contains('mid') ? 'center' : '' }) || '<w:p/>';
      x += `<w:tc><w:tcPr><w:tcW w:w="${widths[k] || 1000}" w:type="dxa"/>${th ? '<w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>' : ''}${isGrid ? '<w:vAlign w:val="center"/>' : ''}</w:tcPr>${inner}</w:tc>`;
    });
    x += '</w:tr>';
  });
  return x + '</w:tbl><w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr></w:p>';
}
async function dxNormImgs(box) {
  for (const im of [...box.querySelectorAll('img')]) {
    try {
      await new Promise((ok, no) => { if (im.complete && im.naturalWidth) ok(); else { im.onload = ok; im.onerror = no; } });
      if (!im.getAttribute('width')) { im.setAttribute('width', im.naturalWidth); im.setAttribute('height', im.naturalHeight); }
      if (!/^data:image\/(png|jpeg)/.test(im.src)) { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); im.src = c.toDataURL('image/png'); }
    } catch (e) { im.remove(); }
  }
}

    { name: 'word/_rels/document.xml.rels', data: T(`${H}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdSt" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${ctx.media.map(m => `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${m.target}"/>`).join('')}</Relationships>`) },
    { name: 'word/styles.xml', data: T(`${H}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="${lang}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`) },
    { name: 'word/document.xml', data: T(`${H}<w:document ${NS}><w:body>${inner}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`) },
    ...ctx.media.map(m => ({ name: m.name, data: m.data }))
